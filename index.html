    function aplicarFiltros(){markersLayer.clearLayers();var fM=document.getElementById('filtroMes').value,fA=document.getElementById('filtroAno').value,fS=document.getElementById('filtroSituacao').value,fMu=document.getElementById('filtroMunicipio').value,fN=document.getElementById('filtroNucda').value,c=0;allFeatures.forEach(function(f){var p=f.properties;var mes=(p.mes||'').toString(),ano=(p.ano||'').toString(),sit=(p.situacao||'').toString(),mun=(p.municipio||'').toString(),nuc=(p.NUCDA||'').toString();if((!fM||mes===fM)&&(!fA||ano===fA)&&(!fS||sit===fS)&&(!fMu||mun===fMu)&&(!fN||nuc===fN)){var co=getCor(f),cr=f.geometry.coordinates;var m=L.circleMarker([cr[1],cr[0]],{radius:6,fillColor:co,color:'#333',weight:1,fillOpacity:0.85});m.bindPopup('<b>Propriedade:</b> '+(p.codpropriedade||'-')+'<br><b>Produtor:</b> '+(p.nomeprodutor||'-')+'<br><b>Municipio:</b> '+(p.municipio||'-')+'<br><b>NUCDA:</b> '+(p.NUCDA||'-')+'<br><b>Mes/Ano:</b> '+(p.mes||'-')+'/'+(p.ano||'-')+'<br><b>Status Cad:</b> '+(p.st_atualz||'-')+'<br><b>Status Geo:</b> '+(p.status_geo||'-')+'<br><b>Situacao:</b> '+(p.situacao||'-')+'<br><b>Cadastro:</b> '+(p.cad||'-')+'<br><b>Atualizacao:</b> '+(p.atualz||'-'));m.addTo(markersLayer);c++;}});document.getElementById('info').innerHTML='<b>'+c+'</b> propriedades exibidas';}
    function limparFiltros(){document.getElementById('filtroMes').value='';document.getElementById('filtroAno').value='';document.getElementById('filtroSituacao').value='';document.getElementById('filtroMunicipio').value='';document.getElementById('filtroNucda').value='';aplicarFiltros();}
    aplicarFiltros();
    </script>
